// ─── SAVE BUTTON ────────────────────────────────────────────────────────
function SaveButton({ storyId, onSave, saved, size = 'sm' }) {
  const isSaved = saved.has(storyId);
  const [animating, setAnimating] = useState(false);
  const [particles, setParticles] = useState([]);

  const handleClick = (e) => {
    e.preventDefault();e.stopPropagation();
    if (!isSaved) {
      setAnimating(true);
      const pts = Array.from({ length: 8 }, function (_, i) {return { id: i, dx: Math.cos(i / 8 * Math.PI * 2) * 28, dy: Math.sin(i / 8 * Math.PI * 2) * 28 };});
      setParticles(pts);
      setTimeout(() => {setAnimating(false);setParticles([]);}, 600);
    }
    onSave(storyId);
  };

  const iconSize = size === 'lg' ? 22 : 18;
  const color = isSaved ? 'var(--brand)' : 'var(--text-muted)';

  return (
    <div style={{ position: 'relative', display: 'inline-flex', alignItems: 'center' }}>
      {particles.map((p) =>
      <div key={p.id} style={{
        position: 'absolute', left: '50%', top: '50%',
        width: 5, height: 5, borderRadius: '50%',
        background: 'var(--brand)',
        '--dx': p.dx + 'px', '--dy': p.dy + 'px',
        animation: 'particleOut .5s ease forwards',
        pointerEvents: 'none', zIndex: 10
      }} />
      )}
      <button
        onClick={handleClick}
        title={isSaved ? 'Remove from shelf' : 'Save to shelf'}
        aria-pressed={isSaved}
        style={{
          display: 'flex', alignItems: 'center', gap: 6,
          color, transition: 'color .2s',
          animation: animating ? 'bookmarkPop .4s ease' : 'none'
        }}>
        
        <svg width={iconSize} height={iconSize} viewBox="0 0 24 24" fill={isSaved ? 'var(--brand)' : 'none'} stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
        {size === 'lg' && <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase' }}>{isSaved ? 'Saved' : 'Save'}</span>}
      </button>
    </div>);

}

// ─── TOAST ──────────────────────────────────────────────────────────────
function Toast({ toast }) {
  if (!toast.visible && !toast.hiding) return null;
  return (
    <div style={{
      position: 'fixed', bottom: 32, right: 32, zIndex: 9999,
      background: 'var(--surface-2)', border: '1px solid var(--border-med)',
      borderRadius: 12, padding: '12px 18px',
      display: 'flex', alignItems: 'center', gap: 10,
      boxShadow: '0 8px 24px rgba(0,0,0,.3)',
      animation: toast.hiding ? 'toastOut .25s ease forwards' : 'toastIn .3s ease forwards',
      backdropFilter: 'blur(12px)'
    }}>
      <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--brand)', flexShrink: 0 }} />
      <span style={{ fontSize: 13, fontWeight: 500, color: 'var(--text-strong)' }}>{toast.msg}</span>
    </div>);

}

          <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>{story.source}</span>

            <SaveButton storyId={story.id} saved={saved} onSave={onSave} size="lg" />
          </div>
        </div>
      </div>
    </section>);

}

// ─── TOPIC SECTION ───────────────────────────────────────────────────────
function TopicSection({ topic, stories, saved, onSave }) {
  if (!stories.length) return null;
  const label = TOPIC_LABELS[topic];
  const cols = stories.length >= 3 ? 3 : stories.length === 2 ? 2 : 1;

  return (
    <section style={{ marginBottom: 56 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24, paddingBottom: 16, borderBottom: '1px solid var(--border)' }}>
        <div style={{ width: 3, height: 18, borderRadius: 99, background: 'var(--brand)', flexShrink: 0 }} />
        <h2 style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>{label}</h2>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: `repeat(${cols}, 1fr)`, gap: 16 }}>
        {stories.map((s, i) => <StoryCard key={s.id} story={s} saved={saved} onSave={onSave} delay={i * 60} />)}
      </div>
    </section>);

}

// ─── SHELF VIEW ──────────────────────────────────────────────────────────
function ShelfView({ saved, onSave, allStories, onBack }) {
  const [filter, setFilter] = useState('all');
  const savedStories = useMemo(() => allStories.filter((s) => saved.has(s.id)), [allStories, saved]);
  const topics = useMemo(() => [...new Set(savedStories.map((s) => s.topic))], [savedStories]);
  const filtered = filter === 'all' ? savedStories : savedStories.filter((s) => s.topic === filter);

  const exportMd = () => {
    const md = savedStories.map((s) => `## ${s.headline}\n\n${s.dek}\n\n**Source:** ${s.source}\n\n[Read →](${s.sourceUrl})\n\n---`).join('\n\n');
    const a = document.createElement('a');a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
    a.download = 'shelf.md';a.click();
  };

  return (
    <div style={{ minHeight: '100vh', paddingTop: 72 }}>
      {/* header */}
      <div style={{ padding: '48px clamp(20px,5vw,80px) 32px', borderBottom: '1px solid var(--border)' }}>
        <button onClick={onBack} style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text-muted)', fontSize: 12, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 24, transition: 'color .15s' }}
        onMouseEnter={(e) => e.currentTarget.style.color = 'var(--text-strong)'}
        onMouseLeave={(e) => e.currentTarget.style.color = 'var(--text-muted)'}>
          
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 12H5M5 12l7 7M5 12l7-7" /></svg>
          Back to digest
        </button>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
          <div>
            <h1 style={{ fontSize: 'clamp(28px,4vw,48px)', fontWeight: 800, letterSpacing: '-0.02em', color: 'var(--text-strong)' }}>Your shelf</h1>
            <p style={{ fontSize: 14, color: 'var(--text-muted)', marginTop: 6 }}>{savedStories.length} saved {savedStories.length === 1 ? 'story' : 'stories'}</p>
          </div>
          {savedStories.length > 0 &&
          <button onClick={exportMd} style={{ display: 'flex', alignItems: 'center', gap: 7, border: '1px solid var(--border)', borderRadius: 10, padding: '9px 16px', fontSize: 12, fontWeight: 600, color: 'var(--text-med)', transition: 'border-color .15s,color .15s' }}
          onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--brand)';e.currentTarget.style.color = 'var(--brand)';}}
          onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)';e.currentTarget.style.color = 'var(--text-med)';}}>
            
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
              Export as Markdown
            </button>
          }
        </div>
        {topics.length > 1 &&
        <div style={{ display: 'flex', gap: 8, marginTop: 24, flexWrap: 'wrap' }}>
            {['all', ...topics].map((t) =>
          <button key={t} onClick={() => setFilter(t)} style={{
            padding: '5px 14px', borderRadius: 99, fontSize: 11, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase',
            border: filter === t ? '1px solid var(--brand)' : '1px solid var(--border)',
            background: filter === t ? 'var(--brand)' : 'transparent',
            color: filter === t ? '#fff' : 'var(--text-muted)',
            transition: 'all .15s', cursor: 'pointer'
          }}>{t === 'all' ? 'All' : TOPIC_LABELS[t]}</button>
          )}
          </div>
        }
      </div>

      {savedStories.length === 0 ?
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '80px 20px', textAlign: 'center' }}>
          <div style={{ width: 64, height: 64, borderRadius: 16, background: 'var(--surface)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 20 }}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" strokeWidth="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" /></svg>
          </div>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: 'var(--text-strong)', marginBottom: 8 }}>Nothing saved yet</h2>
          <p style={{ fontSize: 14, color: 'var(--text-muted)', maxWidth: 340, lineHeight: 1.6 }}>Save stories from the digest to build your personal reading list.</p>
          <button onClick={onBack} style={{ marginTop: 24, color: 'var(--brand)', fontSize: 13, fontWeight: 600 }}>Browse today's digest</button>
        </div> :

      <div style={{ padding: '32px clamp(20px,5vw,80px)', display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', gap: 16 }}>
          {filtered.map((s, i) => <StoryCard key={s.id} story={s} saved={saved} onSave={onSave} delay={i * 40} />)}
        </div>
      }
    </div>);

}

// ─── NAV ────────────────────────────────────────────────────────────────
function Nav({ scrolled, theme, onThemeToggle, savedCount, onShelfClick }) {
  return (
    <header style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      height: scrolled ? 52 : 64,
      background: scrolled ? 'var(--nav-bg)' : 'transparent',
      backdropFilter: scrolled ? 'blur(16px)' : 'none',
      borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',
      transition: 'height .25s,background .25s,border-color .25s,backdrop-filter .25s',
      display: 'flex', alignItems: 'center', padding: '0 clamp(20px,5vw,80px)', gap: 16
    }}>
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 28, height: 28, borderRadius: 8, background: 'var(--brand)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <span style={{ fontSize: 11, fontWeight: 800, color: '#fff', letterSpacing: '-0.03em' }}>DD</span>
        </div>
        <span style={{ fontSize: 13, fontWeight: 700, letterSpacing: '-0.01em', color: 'var(--text-strong)' }}>Daily Digest</span>
        <span style={{ fontSize: 11, color: 'var(--text-muted)', marginLeft: 4, display: scrolled ? 'none' : 'inline' }}>Apr 22, 2026</span>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <button onClick={onShelfClick} style={{
          display: 'flex', alignItems: 'center', gap: 6,
          border: '1px solid var(--border)', borderRadius: 10,
          padding: '6px 14px', fontSize: 12, fontWeight: 600, color: 'var(--text-med)',
          transition: 'border-color .15s,color .15s,background .15s'
        }}
        onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--brand)';e.currentTarget.style.color = 'var(--brand)';}}
        onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)';e.currentTarget.style.color = 'var(--text-med)';}}>
          
          <svg width="14" height="14" viewBox="0 0 24 24" fill={savedCount > 0 ? 'var(--brand)' : 'none'} stroke={savedCount > 0 ? 'var(--brand)' : 'currentColor'} strokeWidth="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" /></svg>
          Shelf {savedCount > 0 && <span style={{ background: 'var(--brand)', color: '#fff', borderRadius: 99, padding: '0 6px', fontSize: 10, fontWeight: 700, lineHeight: '16px' }}>{savedCount}</span>}
        </button>

        <button onClick={onThemeToggle} style={{
          width: 36, height: 36, borderRadius: 10, border: '1px solid var(--border)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'var(--text-muted)', transition: 'border-color .15s,color .15s'
        }}
        onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--border-med)';e.currentTarget.style.color = 'var(--text-strong)';}}
        onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)';e.currentTarget.style.color = 'var(--text-muted)';}}
        title="Toggle theme">
          {theme === 'dark' ?
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg> :

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
          }
        </button>
      </div>
    </header>);

}

// ─── TWEAKS ──────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{ "accentColor": "cyan", "cardRadius": 16, "showDek": true } /*EDITMODE-END*/;

function TweaksPanel({ tweaks, onTweak, onClose }) {
  return (
    <div style={{ position: 'fixed', bottom: 24, right: 24, zIndex: 200, background: 'var(--surface)', border: '1px solid var(--border-med)', borderRadius: 16, padding: 20, width: 240, boxShadow: '0 8px 32px rgba(0,0,0,.4)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Tweaks</span>
        <button onClick={onClose} style={{ color: 'var(--text-muted)', lineHeight: 1 }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div>
          <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', letterSpacing: '0.06em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Brand accent</label>
          <div style={{ display: 'flex', gap: 8 }}>
            {[['cyan', '#049EE2'], ['orange', '#FD6325'], ['green', '#08AC3A']].map(([k, c]) =>
            <button key={k} onClick={() => onTweak('accentColor', k)} style={{ width: 28, height: 28, borderRadius: 8, background: c, border: tweaks.accentColor === k ? '2px solid var(--text-strong)' : '2px solid transparent', transition: 'border-color .15s' }} />
            )}
          </div>
        </div>
        <div>
          <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', letterSpacing: '0.06em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Card radius — {tweaks.cardRadius}px</label>
          <input type="range" min={4} max={24} value={tweaks.cardRadius} onChange={(e) => onTweak('cardRadius', +e.target.value)}
          style={{ width: '100%', accentColor: 'var(--brand)' }} />
        </div>
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
          <input type="checkbox" checked={tweaks.showDek} onChange={(e) => onTweak('showDek', e.target.checked)} style={{ accentColor: 'var(--brand)', width: 14, height: 14 }} />
          <span style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-med)' }}>Show descriptions</span>
        </label>
      </div>
    </div>);

}

// ─── APP ─────────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem('dd-theme') || 'dark');
  const [view, setView] = useState('home');
  const [saved, setSaved] = useState(() => {
    try {return new Set(JSON.parse(localStorage.getItem('dd-saved') || '[]'));}
    catch {return new Set();}
  });
  const [toast, setToast] = useState({ visible: false, hiding: false, msg: '' });
  const [scrolled, setScrolled] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const toastTimer = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('dd-theme', theme);
  }, [theme]);

  useEffect(() => {
    localStorage.setItem('dd-saved', JSON.stringify([...saved]));
  }, [saved]);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Apply tweaks
  useEffect(() => {
    const accentMap = { cyan: '#049EE2', orange: '#FD6325', green: '#08AC3A' };
    document.documentElement.style.setProperty('--brand', accentMap[tweaks.accentColor] || '#049EE2');
    document.querySelectorAll('article').forEach((el) => {el.style.borderRadius = tweaks.cardRadius + 'px';});
  }, [tweaks]);

  const showToast = (msg) => {
    clearTimeout(toastTimer.current);
    setToast({ visible: true, hiding: false, msg });
    toastTimer.current = setTimeout(() => {
      setToast((t) => ({ ...t, hiding: true }));
      setTimeout(() => setToast({ visible: false, hiding: false, msg: '' }), 300);
    }, 2200);
  };

  const handleSave = useCallback((id) => {
    setSaved((prev) => {
      const next = new Set(prev);
      if (next.has(id)) {next.delete(id);showToast('Removed from shelf');} else
      {next.add(id);showToast('Saved to shelf');}
      return next;
    });
  }, []);

  const handleTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };

  // Tweaks panel toggle support
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const topicsWithStories = TOPIC_ORDER.filter((t) => t !== 'product-design' && BY_TOPIC[t]?.length > 0);

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      <Nav scrolled={scrolled} theme={theme} onThemeToggle={() => setTheme((t) => t === 'dark' ? 'light' : 'dark')} savedCount={saved.size} onShelfClick={() => setView((v) => v === 'shelf' ? 'home' : 'shelf')} />
      
      {view === 'shelf' ?
      <ShelfView saved={saved} onSave={handleSave} allStories={STORIES} onBack={() => setView('home')} /> :

      <main>
          <Hero story={HERO} saved={saved} onSave={handleSave} />
          <div style={{ padding: '56px clamp(20px,5vw,80px)' }}>
            {/* Hero topic inline */}
            <TopicSection topic="product-design" stories={BY_TOPIC['product-design']} saved={saved} onSave={handleSave} />
            {topicsWithStories.map((t) =>
          <TopicSection key={t} topic={t} stories={BY_TOPIC[t]} saved={saved} onSave={handleSave} />
          )}
          </div>
          <footer style={{ borderTop: '1px solid var(--border)', padding: '24px clamp(20px,5vw,80px)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ width: 20, height: 20, borderRadius: 6, background: 'var(--brand)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ fontSize: 8, fontWeight: 800, color: '#fff' }}>DD</span>
              </div>
              <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>Daily Digest · Apr 22, 2026 · Issue #204</span>
            </div>
            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>Curated intelligence for product designers building in the AI era</span>
          </footer>
        </main>
      }

      <Toast toast={toast} />
      {tweaksOpen && <TweaksPanel tweaks={tweaks} onTweak={handleTweak} onClose={() => setTweaksOpen(false)} />}
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
